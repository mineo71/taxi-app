<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taxi — Admin</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../packages/shared/ui.css">
</head>
<body>
  <div class="app wide">
    <div class="topbar" style="background:#fff">
      <span>🚕 Taxi · Admin panel</span>
      <small>Prototype · mock data</small>
    </div>

    <section class="panel">
      <!-- FR-34: analytics -->
      <div class="grid" id="kpis"></div>

      <div class="grid">
        <!-- FR-30: tariffs -->
        <div class="card">
          <b>Tariffs · Kyiv</b>
          <p class="muted">Example: 5 km, 15 min trip, no surge</p>
          <table>
            <thead><tr><th>Class</th><th>Pickup, ₴</th><th>Per km, ₴</th><th>Example</th></tr></thead>
            <tbody id="tariffs"></tbody>
          </table>
        </div>

        <!-- FR-29: driver moderation -->
        <div class="card">
          <b>Driver moderation</b>
          <table>
            <thead><tr><th>Driver</th><th>Documents</th><th></th></tr></thead>
            <tbody id="drivers"></tbody>
          </table>
        </div>
      </div>

      <!-- FR-31: active trips -->
      <div class="card">
        <b>Active trips</b>
        <table>
          <thead><tr><th>#</th><th>Passenger</th><th>Driver</th><th>Route</th><th>Status</th><th>Price</th></tr></thead>
          <tbody id="trips"></tbody>
        </table>
      </div>

      <!-- FR-33: promo codes -->
      <div class="card">
        <b>Promo codes</b>
        <table>
          <thead><tr><th>Code</th><th>Discount</th><th>Used</th><th>Valid until</th></tr></thead>
          <tbody>
            <tr><td>START10</td><td>10%</td><td>412</td><td>2026-12-31</td></tr>
            <tr><td>AIRPORT</td><td>₴50</td><td>87</td><td>2026-11-30</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="../../packages/shared/pricing.js"></script>
  <script src="app.js"></script>
</body>
</html>
