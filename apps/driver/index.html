<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taxi — Driver</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../packages/shared/ui.css">
</head>
<body>
  <div class="app">
    <div class="topbar">
      <span>🚕 Taxi · Driver</span>
      <small>Driver app prototype</small>
    </div>

    <section class="panel">
      <!-- FR-21: online / offline -->
      <div class="card between">
        <div>
          <div class="status" id="onlineLabel">Offline</div>
          <div class="muted">Andrii K. · ★ 4.92 · acceptance <span id="acceptRate">96</span>%</div>
        </div>
        <button class="toggle" id="onlineToggle" aria-label="Go online"></button>
      </div>

      <!-- FR-28: order filters -->
      <div class="row">
        <div>
          <label for="radius">Radius</label>
          <select id="radius">
            <option value="2">up to 2 km</option>
            <option value="5" selected>up to 5 km</option>
            <option value="10">up to 10 km</option>
          </select>
        </div>
        <div>
          <label for="payFilter">Payment type</label>
          <select id="payFilter">
            <option value="any">Any</option>
            <option value="Card">Card only</option>
            <option value="Cash">Cash only</option>
          </select>
        </div>
      </div>

      <!-- FR-22: incoming offer with limited time to respond -->
      <div class="card hidden" id="offerCard">
        <div class="between">
          <b>New order</b>
          <span class="badge warn" id="offerTimer"></span>
        </div>
        <div class="progress" style="margin:8px 0"><div id="offerProgress" style="width:100%"></div></div>
        <div id="offerBody"></div>
        <div class="row" style="margin-top:10px">
          <button class="btn secondary" id="declineBtn">Skip</button>
          <button class="btn" id="acceptBtn">Accept</button>
        </div>
      </div>

      <!-- FR-23 … FR-25: active trip -->
      <div class="card hidden" id="tripCard">
        <div class="between">
          <b id="tripTitle"></b>
          <span class="badge" id="tripBadge"></span>
        </div>
        <div class="muted" id="tripBody" style="margin:6px 0 10px"></div>
        <div class="row">
          <button class="btn secondary" id="navBtn">🧭 Navigate</button>
          <button class="btn" id="tripAction"></button>
        </div>
      </div>

      <div class="muted" id="toast"></div>

      <!-- FR-26: earnings -->
      <div class="card">
        <div class="between">
          <div>
            <label>Balance</label>
            <div class="kpi" id="balance">₴0</div>
          </div>
          <button class="btn secondary" id="withdrawBtn">Withdraw</button>
        </div>
        <div class="muted">Trips today: <span id="tripsToday">0</span> · service fee 15%</div>
        <div id="earnings" class="muted" style="margin-top:6px"></div>
      </div>
    </section>
  </div>

  <script src="../../packages/shared/pricing.js"></script>
  <script src="app.js"></script>
</body>
</html>
