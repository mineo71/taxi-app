<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taxi — Passenger</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../packages/shared/ui.css">
</head>
<body>
  <div class="app">
    <div class="topbar">
      <span>🚕 Taxi</span>
      <small>Passenger app prototype</small>
    </div>

    <div class="map" id="map">
      <div class="pin from" id="pinFrom" style="left:28%;top:72%"></div>
      <div class="pin to" id="pinTo" style="left:76%;top:24%"></div>
      <div class="car hidden" id="car">🚗</div>
    </div>

    <!-- Step 1: order form (FR-3 … FR-8, FR-15) -->
    <section class="panel" id="orderView">
      <div>
        <label for="from">From</label>
        <input id="from" value="22 Khreshchatyk St">
      </div>
      <div>
        <label for="to">To</label>
        <select id="to">
          <option value="4.2|12">Central Railway Station, 1 Vokzalna Sq</option>
          <option value="6.8|18">Ocean Plaza Mall, 176 Antonovycha St</option>
          <option value="7.5|20">Igor Sikorsky KPI, 37 Beresteiskyi Ave</option>
          <option value="35|45">Boryspil International Airport</option>
        </select>
      </div>

      <div class="between">
        <span class="muted" id="routeInfo"></span>
        <span class="badge warn hidden" id="surgeBadge"></span>
      </div>

      <div class="classes" id="classes"></div>

      <div class="card">
        <label>Extra options</label>
        <div id="extras"></div>
        <label style="margin-top:8px">
          <input type="checkbox" id="boost" style="width:auto"> Raise price by 10% for a faster search
        </label>
        <input id="comment" placeholder="Note for the driver" style="margin-top:6px">
      </div>

      <div class="row">
        <div>
          <label for="payment">Payment</label>
          <select id="payment">
            <option>Card •••• 4242</option>
            <option>Cash</option>
            <option>Apple Pay</option>
            <option>Google Pay</option>
            <option>Corporate account</option>
          </select>
        </div>
        <div>
          <label for="promo">Promo code</label>
          <input id="promo" placeholder="START10">
        </div>
      </div>

      <button class="btn" id="orderBtn">Order</button>
    </section>

    <!-- Step 2: active trip (FR-9 … FR-14) -->
    <section class="panel hidden" id="tripView">
      <div class="status" id="tripStatus"></div>
      <div class="muted" id="tripHint"></div>
      <div class="progress"><div id="tripProgress" style="width:0%"></div></div>

      <div class="card hidden" id="driverCard">
        <div class="between">
          <div>
            <b>Andrii K.</b> <span class="badge">★ 4.92</span><br>
            <span class="muted">Skoda Octavia · grey · <b>AA 1234 KT</b></span>
          </div>
          <span style="font-size:36px">👨🏻‍✈️</span>
        </div>
        <div class="row" style="margin-top:10px">
          <button class="btn secondary" data-msg="Calling via masked number +380 •• ••• •• 17">📞 Call</button>
          <button class="btn secondary" data-msg="Trip link sent to your contacts">📤 Share</button>
          <button class="btn danger" data-msg="SOS: alert sent to the safety team">SOS</button>
        </div>
      </div>

      <div class="muted" id="toast"></div>
      <button class="btn danger" id="cancelBtn">Cancel trip</button>
    </section>

    <!-- Step 3: rating and receipt (FR-16 … FR-18) -->
    <section class="panel hidden" id="doneView">
      <div class="status">Trip completed</div>
      <div class="card">
        <div class="between"><span>Estimated price</span><span id="estimateValue"></span></div>
        <div class="between"><span>Final price</span><b id="finalValue"></b></div>
        <div class="muted" id="finalBreakdown"></div>
      </div>
      <div class="card">
        <label>Rate your driver</label>
        <div class="stars" id="stars"></div>
        <label style="margin-top:8px">Tip</label>
        <div class="row" id="tips">
          <button class="btn secondary" data-tip="0">No tip</button>
          <button class="btn secondary" data-tip="20">₴20</button>
          <button class="btn secondary" data-tip="50">₴50</button>
        </div>
      </div>
      <button class="btn" id="doneBtn">Done</button>
    </section>

    <section class="panel">
      <div class="card">
        <label>Trip history</label>
        <div id="history" class="muted">No trips yet</div>
      </div>
    </section>
  </div>

  <script src="../../packages/shared/pricing.js"></script>
  <script src="app.js"></script>
</body>
</html>
