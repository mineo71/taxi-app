<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Таксі — пасажир</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../../packages/shared/ui.css">
</head>
<body>
  <div class="app">
    <div class="topbar">
      <span>🚕 Таксі</span>
      <small>Прототип застосунку пасажира</small>
    </div>

    <div class="map" id="map">
      <div class="pin from" id="pinFrom" style="left:28%;top:72%"></div>
      <div class="pin to" id="pinTo" style="left:76%;top:24%"></div>
      <div class="car hidden" id="car">🚗</div>
    </div>

    <!-- Step 1: order form (FR-3 … FR-8, FR-15) -->
    <section class="panel" id="orderView">
      <div>
        <label for="from">Звідки</label>
        <input id="from" value="вул. Хрещатик, 22">
      </div>
      <div>
        <label for="to">Куди</label>
        <select id="to">
          <option value="4.2|12">Залізничний вокзал, Вокзальна пл., 1</option>
          <option value="6.8|18">ТРЦ Ocean Plaza, вул. Антоновича, 176</option>
          <option value="7.5|20">КПІ, просп. Берестейський, 37</option>
          <option value="35|45">Аеропорт «Бориспіль»</option>
        </select>
      </div>

      <div class="between">
        <span class="muted" id="routeInfo"></span>
        <span class="badge warn hidden" id="surgeBadge"></span>
      </div>

      <div class="classes" id="classes"></div>

      <div class="card">
        <label>Додаткові побажання</label>
        <div id="extras"></div>
        <label style="margin-top:8px">
          <input type="checkbox" id="boost" style="width:auto"> Підняти ціну на 10% для швидшого пошуку
        </label>
        <input id="comment" placeholder="Коментар водієві" style="margin-top:6px">
      </div>

      <div class="row">
        <div>
          <label for="payment">Оплата</label>
          <select id="payment">
            <option>Картка •••• 4242</option>
            <option>Готівка</option>
            <option>Apple Pay</option>
            <option>Google Pay</option>
            <option>Корпоративний рахунок</option>
          </select>
        </div>
        <div>
          <label for="promo">Промокод</label>
          <input id="promo" placeholder="START10">
        </div>
      </div>

      <button class="btn" id="orderBtn">Замовити</button>
    </section>

    <!-- Step 2: active trip (FR-9 … FR-14) -->
    <section class="panel hidden" id="tripView">
      <div class="status" id="tripStatus"></div>
      <div class="muted" id="tripHint"></div>
      <div class="progress"><div id="tripProgress" style="width:0%"></div></div>

      <div class="card hidden" id="driverCard">
        <div class="between">
          <div>
            <b>Андрій К.</b> <span class="badge">★ 4.92</span><br>
            <span class="muted">Skoda Octavia · сіра · <b>AA 1234 KT</b></span>
          </div>
          <span style="font-size:36px">👨🏻‍✈️</span>
        </div>
        <div class="row" style="margin-top:10px">
          <button class="btn secondary" data-msg="Дзвінок через маскований номер +380 •• ••• •• 17">📞 Дзвінок</button>
          <button class="btn secondary" data-msg="Посилання на поїздку надіслано близьким">📤 Поділитися</button>
          <button class="btn danger" data-msg="SOS: сигнал передано службі підтримки">SOS</button>
        </div>
      </div>

      <div class="muted" id="toast"></div>
      <button class="btn danger" id="cancelBtn">Скасувати поїздку</button>
    </section>

    <!-- Step 3: rating and receipt (FR-16 … FR-18) -->
    <section class="panel hidden" id="doneView">
      <div class="status">Поїздку завершено</div>
      <div class="card">
        <div class="between"><span>Попередня оцінка</span><span id="estimateValue"></span></div>
        <div class="between"><span>Фактична вартість</span><b id="finalValue"></b></div>
        <div class="muted" id="finalBreakdown"></div>
      </div>
      <div class="card">
        <label>Оцініть водія</label>
        <div class="stars" id="stars"></div>
        <label style="margin-top:8px">Чайові</label>
        <div class="row" id="tips">
          <button class="btn secondary" data-tip="0">Без чайових</button>
          <button class="btn secondary" data-tip="20">20 ₴</button>
          <button class="btn secondary" data-tip="50">50 ₴</button>
        </div>
      </div>
      <button class="btn" id="doneBtn">Готово</button>
    </section>

    <section class="panel">
      <div class="card">
        <label>Історія поїздок</label>
        <div id="history" class="muted">Поки що порожньо</div>
      </div>
    </section>
  </div>

  <script src="../../packages/shared/pricing.js"></script>
  <script src="app.js"></script>
</body>
</html>
